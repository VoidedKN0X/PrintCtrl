name: Feature request
description: Suggest an idea for PrintCtrl
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
  - type: textarea
    id: else
    attributes:
      label: Anything else?
