name: Build APK

on:
  push:
    branches: [main]
    # Only changes to the app itself make a new release. README, licence, badges
    # and CI edits don't, so Obtainium and the F-Droid repo only see real updates.
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A release is published only when versionName (and versionCode) in
  # app/build.gradle.kts are bumped. Other pushes just build to check the code.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0   # tags, to see whether this version is already released

      - name: Check for a version bump
        id: v
        run: bash .github/scripts/check-version.sh

  build:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      release_signed: ${{ steps.signature.outputs.release_signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Releases must be signed with the stable key. Without it the build fails rather than
      # producing a debug-signed APK (Gradle refuses on CI as well).
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error title=Signing key missing::KEYSTORE_BASE64 secret is not set - refusing to build a debug-signed release"
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_SIGNED=1" >> "$GITHUB_ENV"

      # The opt-in usage stats need the Aptabase app key. A release without it would quietly ship with
      # stats switched off for everyone, so releases stop here instead; other builds only warn.
      - name: Check usage stats key
        env:
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          if [ -n "$APTABASE_KEY" ]; then
            echo "Usage stats key is set."
          elif [ "$RELEASE" = "true" ]; then
            echo "::error title=Usage stats key missing::Add the APTABASE_KEY secret (Settings > Secrets and variables > Actions), then re-run this workflow"
            exit 1
          else
            echo "::warning title=Usage stats key missing::APTABASE_KEY isn't set, so this build can't send usage stats"
          fi

      - name: Build release APK
        env:
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ vars.KEY_ALIAS || secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      # Remove the key as soon as signing is done, even if the build failed.
      - name: Delete signing key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=" >> "$GITHUB_ENV"

      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler and Gradle errors as annotations so they show on the run page and in the API.
          [ -f build.log ] || exit 0
          grep -E '^e: |^ERROR:|error: |What went wrong' -A 3 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Rename APKs
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            cp "$f" "out/PrintCtrl-${TAG}.apk"
          done
          ls -la out

      - name: Check signature
        id: signature
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          APK="out/PrintCtrl-${TAG}.apk"
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "certificate DN" | sed 's/^[^:]*: //')
          echo "Signed by: $CERT"
          if echo "$CERT" | grep -q "Android Debug"; then
            echo "::error title=Signing failed::APK is debug-signed - check the key alias and passwords"
            exit 1
          fi
          if [ "$RELEASE_SIGNED" = "1" ]; then
            echo "release_signed=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PrintCtrl-apk
          path: out/*.apk
          if-no-files-found: error

  # Separate job with no access to the signing secrets; it only gets the finished, release-signed APK.
  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build.outputs.release_signed == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0   # full history and tags, for the release notes

      - name: Write release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          bash .github/scripts/release-notes.sh "$TAG" "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PrintCtrl-apk
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          tag="${TAG}"
          gh release create "$tag" out/*.apk \
            --target "$GITHUB_SHA" \
            --title "PrintCtrl ${tag#v}" \
            --notes-file "$RUNNER_TEMP/notes.md"
